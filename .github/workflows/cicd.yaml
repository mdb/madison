---
name: cicd

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
      - run: npm ci
      - name: Lint and run unit tests
        run: npm test

  validate-version:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Show GitHub object for troubleshooting
        run: echo "$GH_JSON"
        env:
          GH_JSON: ${{ toJSON(github) }}
      - uses: actions/checkout@v5
      - name: Get commit message (pull_request)
        if: github.event_name == 'pull_request'
        run: |
          pr_num="${{ github.event.pull_request.number }}"
          git fetch origin refs/pull/${pr_num}/head:refs/remotes/origin/pull/${pr_num}/head
          commit_body=$(git log -1 --pretty=format:"%b" origin/pull/${pr_num}/head)
          echo "COMMIT_MESSAGE="$(git log -1 --pretty=format:"%b" origin/pull/${pr_num}/head)"" >> $GITHUB_ENV
      - name: Get commit message (push, etc.)
        if: github.event_name != 'pull_request'
        run: echo "COMMIT_MESSAGE="$(git log -1 --pretty=%B)"" >> $GITHUB_ENV
      - name: Show commit message
        run: echo "$COMMIT_MESSAGE"
      - name: Get package.json version
        run: echo "PACKAGE_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
      - uses: mdb/ensure-unpublished-release-action@main
        with:
          tag: ${{ env.PACKAGE_VERSION }}
          token: ${{ secrets.GITHUB_TOKEN }}
          skip-pattern: '[skip validate-version]'
          commit-message: '${{ env.COMMIT_MESSAGE }}'

  release:
    if: github.ref == 'refs/heads/master' && !contains(github.event.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    needs: validate-version
    steps:
      - uses: actions/checkout@v5
      - name: Get package.json version
        run: echo "PACKAGE_VERSION=$(jq -r .version package.json)" >> $GITHUB_ENV
      - name: Create GitHub release
        run: gh release create ${{ env.PACKAGE_VERSION }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to NPM registry
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
